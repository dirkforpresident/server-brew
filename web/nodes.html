<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeTetra — Aktive Knoten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f4f1; --panel:#ffffff; --fg:#1b1c1f; --muted:#63666e; --faint:#9a9ba1;
    --line:#e5e3dc; --accent:#b06a06; --accent-dim:#8a5305; --live:#1f9d57;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --maxw:56rem;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0a0b0d; --panel:#14161d; --fg:#e9eaee; --muted:#8f939d; --faint:#5b606b;
    --line:#242833; --accent:#f2a83c; --accent-dim:#c9862b; --live:#54e08a;
  }}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);
    line-height:1.5;-webkit-font-smoothing:antialiased;padding:2.2rem 1.2rem 4rem}
  .wrap{max-width:var(--maxw);margin:0 auto}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1rem;margin-bottom:.3rem}
  h1{font-size:1.55rem;font-weight:600;margin:0;letter-spacing:-.01em}
  h1 .ft{color:var(--accent)}
  .sub{color:var(--muted);font-size:.9rem}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.1rem;margin:1.1rem 0 1.4rem;
    font-family:var(--mono);font-size:.82rem;color:var(--muted)}
  .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--live);
    display:inline-block;margin-right:.4rem;box-shadow:0 0 0 0 rgba(84,224,138,.5);
    animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(84,224,138,.45)}70%{box-shadow:0 0 0 .5rem rgba(84,224,138,0)}100%{box-shadow:0 0 0 0 rgba(84,224,138,0)}}
  @media (prefers-reduced-motion: reduce){.dot{animation:none}}
  .count b{color:var(--fg);font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:34rem}
  th,td{text-align:left;padding:.72rem .95rem;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-family:var(--mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);font-weight:500}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
  .call{font-family:var(--mono);font-weight:500;font-size:1rem}
  .id{color:var(--faint);font-family:var(--mono);font-size:.78rem}
  .issi{font-family:var(--mono);font-size:.95rem;letter-spacing:.02em}
  .tags{display:flex;flex-wrap:wrap;gap:.35rem}
  .tg{font-family:var(--mono);font-size:.8rem;padding:.12rem .5rem;border-radius:6px;
    background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-dim);font-weight:500}
  :root:not([data-theme="light"]) .tg{color:var(--accent)}
  .st{display:flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.84rem;color:var(--muted)}
  .sd{width:.6rem;height:.6rem;border-radius:50%;flex:none}
  .sd.active{background:var(--live)}
  .sd.standby{background:var(--accent)}
  .sd.offline{background:var(--faint)}
  tr.off{opacity:.5}
  .standby{color:var(--faint);font-family:var(--mono);font-size:.82rem}
  .badge{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
    padding:.18rem .5rem;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
  .badge.FM{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent-dim)}
  :root:not([data-theme="light"]) .badge.FM{color:var(--accent)}
  .num{font-family:var(--mono);color:var(--muted);font-size:.85rem}
  .empty{padding:2.4rem 1rem;text-align:center;color:var(--muted)}
  footer{margin-top:1.6rem;color:var(--faint);font-size:.8rem;font-family:var(--mono)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="ft">FreeTetra</span> — Aktive Knoten</h1>
    <span class="sub">wer ist gerade auf dem Netz erreichbar</span>
  </header>

  <div class="bar">
    <span class="count"><span class="dot"></span><b id="count">–</b> online</span>
    <span id="updated"></span>
    <a href="/anleitung.html" style="margin-left:auto">Anleitung</a>
    <a href="/changelog.html">Changelog</a>
    <a href="/">← FreeTetra</a>
  </div>

  <div class="panel">
    <div class="scroll">
      <table>
        <thead><tr><th>Rufzeichen</th><th>ISSI</th><th>Typ</th><th>Status</th><th>QTH</th><th>seit</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>Gerade keine Knoten verbunden.</div>
  </div>

  <footer id="foot">lade …</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ago(sec){
  if(!sec) return "–";
  let s = Math.max(0, Math.floor(Date.now()/1000) - sec);
  if(s < 60) return s+"s";
  const m = Math.floor(s/60); if(m < 60) return m+" min";
  const h = Math.floor(m/60); if(h < 24) return h+" h "+(m%60)+" min";
  return Math.floor(h/24)+" d "+(h%24)+" h";
}

function statusCell(n){
  if(n.status === "active"){
    const tgs = `<div class="tags">${n.tgs.map(t => `<span class="tg">TG ${t}</span>`).join("")}</div>`;
    return `<div class="st"><span class="sd active"></span>${tgs}</div>`;
  }
  if(n.status === "standby")
    return `<div class="st"><span class="sd standby"></span>online · Standby</div>`;
  return `<div class="st"><span class="sd offline"></span>offline</div>`;
}

function render(d){
  const nodes = (d && d.nodes) || [];
  const online = (d && d.count != null) ? d.count : nodes.filter(n=>n.online).length;
  const total  = (d && d.total != null) ? d.total : nodes.length;
  $('count').textContent = online + " / " + total;
  $('rows').innerHTML = nodes.map(n => {
    const typ = n.type ? `<span class="badge ${esc(n.type)}">${esc(n.type)}</span>` : "";
    return `<tr class="${n.online ? "" : "off"}">
      <td><span class="call">${esc(n.call)}</span><br><span class="id">${esc(n.id)}</span></td>
      <td><span class="issi">${n.issi ? n.issi : "–"}</span></td>
      <td>${typ}</td>
      <td>${statusCell(n)}</td>
      <td class="num">${n.qth ? esc(n.qth) : "–"}</td>
      <td class="num">${n.online ? ago(n.since) : "–"}</td>
    </tr>`;
  }).join("");
  $('empty').hidden = nodes.length > 0;
  const upd = d && d.updated ? new Date(d.updated*1000).toLocaleTimeString('de-DE') : "";
  $('updated').textContent = upd ? "Stand "+upd : "";
  $('foot').textContent = "FreeTetra · Live-Verzeichnis · aktualisiert sich alle 5 s";
}

async function tick(){
  try{
    const r = await fetch('/nodes.json', {cache:'no-store'});
    render(await r.json());
  }catch(e){
    $('foot').textContent = "Verzeichnis gerade nicht erreichbar …";
  }
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
